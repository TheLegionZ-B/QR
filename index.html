<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f5aa6">
  <meta name="description" content="สร้าง QR Code จากข้อความหรือลิงก์ และดาวน์โหลดเป็น PNG">
  <title>QR Code Generator</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root{
      --blue:#0f5aa6;
      --blue-dark:#083d76;
      --blue-soft:#eaf4ff;
      --text:#17212b;
      --muted:#6b7785;
      --border:#dbe4ee;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      padding:28px 16px;
      font-family:"Segoe UI",Tahoma,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 0%,#dceeff 0,transparent 32%),
        radial-gradient(circle at 100% 100%,#e6f7f0 0,transparent 28%),
        #f5f8fb;
    }

    .page{
      width:min(760px,100%);
      margin:0 auto;
    }

    .brand{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:12px;
      margin:6px 0 18px;
      color:var(--blue-dark);
      font-weight:800;
    }

    .brand-mark{
      width:42px;
      height:42px;
      border-radius:13px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,var(--blue),var(--blue-dark));
      color:white;
      font-size:22px;
      box-shadow:0 10px 26px rgba(15,90,166,.2);
    }

    .card{
      background:rgba(255,255,255,.94);
      border:1px solid rgba(255,255,255,.85);
      border-radius:26px;
      box-shadow:0 24px 70px rgba(28,58,91,.14);
      overflow:hidden;
    }

    .hero{
      padding:34px 34px 18px;
      text-align:center;
    }

    h1{
      margin:0;
      font-size:clamp(28px,5vw,42px);
      line-height:1.1;
    }

    .subtitle{
      margin:10px auto 0;
      max-width:560px;
      color:var(--muted);
      line-height:1.65;
      font-size:15px;
    }

    .content{
      padding:18px 34px 34px;
    }

    .field-label{
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-bottom:9px;
      font-size:14px;
      font-weight:700;
    }

    .char-count{
      font-size:12px;
      color:var(--muted);
      font-weight:500;
    }

    textarea{
      width:100%;
      min-height:150px;
      padding:16px;
      resize:vertical;
      border-radius:16px;
      border:1px solid var(--border);
      outline:none;
      font:inherit;
      font-size:15px;
      line-height:1.55;
      color:var(--text);
      background:white;
      transition:.18s ease;
    }

    textarea:focus{
      border-color:#79aee0;
      box-shadow:0 0 0 4px rgba(15,90,166,.09);
    }

    .tools{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:10px;
      margin-top:14px;
    }

    button,select{
      min-height:46px;
      border-radius:13px;
      font:inherit;
    }

    button{
      border:0;
      cursor:pointer;
      font-weight:700;
      transition:transform .15s ease,box-shadow .15s ease;
    }

    button:hover{transform:translateY(-1px)}

    .btn-primary{
      background:linear-gradient(135deg,var(--blue),var(--blue-dark));
      color:white;
      box-shadow:0 10px 22px rgba(15,90,166,.18);
    }

    .btn-secondary{
      background:#eef3f8;
      color:#334150;
    }

    .btn-paste{
      background:var(--blue-soft);
      color:var(--blue-dark);
    }

    .options{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:16px;
    }

    .option-card{
      background:#f7f9fc;
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px;
    }

    .option-card label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:7px;
      font-weight:650;
    }

    select{
      width:100%;
      padding:0 10px;
      border:1px solid var(--border);
      background:white;
      color:var(--text);
    }

    .error{
      display:none;
      margin-top:12px;
      padding:11px 13px;
      border-radius:12px;
      background:#fff0f0;
      color:#a52b2b;
      font-size:13px;
    }

    .result{
      display:none;
      margin-top:26px;
      border-top:1px solid #e6ecf2;
      padding-top:26px;
      text-align:center;
    }

    .result-title{
      font-weight:800;
      font-size:18px;
    }

    .qr-shell{
      display:inline-block;
      margin:16px 0 18px;
      padding:20px;
      border-radius:20px;
      background:white;
      box-shadow:0 14px 38px rgba(20,50,80,.12);
      border:1px solid #edf1f5;
    }

    #qrcode{
      display:grid;
      place-items:center;
      min-width:220px;
      min-height:220px;
    }

    #qrcode img,
    #qrcode canvas{
      display:block;
      max-width:100%;
      height:auto!important;
    }

    .download-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .btn-download{
      background:#17212b;
      color:white;
    }

    .btn-copy{
      background:#eaf0f6;
      color:#243241;
    }

    .privacy{
      margin:22px auto 0;
      padding:12px 14px;
      border-radius:13px;
      background:#eef8f3;
      color:#456256;
      font-size:12px;
      line-height:1.55;
    }

    .footer{
      text-align:center;
      color:#8894a1;
      font-size:12px;
      padding:18px 8px 2px;
    }

    @media(max-width:620px){
      body{padding:16px 10px}
      .hero{padding:28px 20px 14px}
      .content{padding:14px 20px 24px}
      .tools,.options,.download-row{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="brand">
      <div class="brand-mark">▦</div>
      <span>QR Utility</span>
    </div>

    <section class="card">

      <div class="hero">
        <h1>QR Code Generator</h1>
        <p class="subtitle">
          วางข้อความหรือลิงก์ แล้วสร้าง QR Code ได้ทันที
          พร้อมดาวน์โหลดเป็นไฟล์ PNG
        </p>
      </div>

      <div class="content">

        <div class="field-label">
          <span>ข้อความ หรือ URL</span>
          <span class="char-count"><span id="charCount">0</span> / 2000</span>
        </div>

        <textarea
          id="inputText"
          maxlength="2000"
          spellcheck="false"
          placeholder="เช่น https://example.com หรือข้อความที่ต้องการสร้างเป็น QR Code"></textarea>

        <div class="tools">
          <button class="btn-primary" id="generateBtn" type="button">
            สร้าง QR Code
          </button>

          <button class="btn-paste" id="pasteBtn" type="button">
            วางจาก Clipboard
          </button>

          <button class="btn-secondary" id="clearBtn" type="button">
            ล้างข้อมูล
          </button>
        </div>

        <div class="options">

          <div class="option-card">
            <label for="qrSize">ขนาดไฟล์ QR</label>
            <select id="qrSize">
              <option value="256">256 × 256 px</option>
              <option value="512" selected>512 × 512 px</option>
              <option value="1024">1024 × 1024 px</option>
            </select>
          </div>

          <div class="option-card">
            <label for="errorLevel">Error Correction</label>
            <select id="errorLevel">
              <option value="L">L — ต่ำ</option>
              <option value="M">M — ปานกลาง</option>
              <option value="Q">Q — สูง</option>
              <option value="H" selected>H — สูงสุด</option>
            </select>
          </div>

        </div>

        <div class="error" id="errorBox"></div>

        <div class="result" id="result">

          <div class="result-title">
            QR Code ของคุณ
          </div>

          <div class="qr-shell">
            <div id="qrcode"></div>
          </div>

          <div class="download-row">

            <button class="btn-download" id="downloadBtn" type="button">
              ดาวน์โหลด PNG
            </button>

            <button class="btn-copy" id="copyBtn" type="button">
              คัดลอก QR
            </button>

          </div>

        </div>

        <div class="privacy">
          🔒 QR Code ถูกสร้างภายใน Browser ของผู้ใช้งาน
          เว็บไซต์นี้ไม่มีฐานข้อมูลสำหรับจัดเก็บข้อความที่กรอก
        </div>

      </div>

    </section>

    <div class="footer">
      QR Code Generator · GitHub Pages
    </div>

  </main>

<script>
const input = document.getElementById("inputText");
const charCount = document.getElementById("charCount");
const result = document.getElementById("result");
const errorBox = document.getElementById("errorBox");
const qrContainer = document.getElementById("qrcode");

input.addEventListener("input", function(){
    charCount.textContent = input.value.length;
});

document.getElementById("generateBtn").addEventListener("click", generateQR);
document.getElementById("clearBtn").addEventListener("click", clearAll);
document.getElementById("pasteBtn").addEventListener("click", pasteFromClipboard);
document.getElementById("downloadBtn").addEventListener("click", downloadQR);
document.getElementById("copyBtn").addEventListener("click", copyQR);

input.addEventListener("keydown", function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){
        generateQR();
    }
});

function showError(message){
    errorBox.textContent = message;
    errorBox.style.display = "block";
}

function hideError(){
    errorBox.style.display = "none";
    errorBox.textContent = "";
}

function getLevel(){
    var value = document.getElementById("errorLevel").value;

    return {
        L: QRCode.CorrectLevel.L,
        M: QRCode.CorrectLevel.M,
        Q: QRCode.CorrectLevel.Q,
        H: QRCode.CorrectLevel.H
    }[value];
}

function generateQR(){

    var text = input.value.trim();

    if (!text){
        result.style.display = "none";
        showError("กรุณากรอกข้อความหรือ URL ก่อนสร้าง QR Code");
        input.focus();
        return;
    }

    if (typeof QRCode === "undefined"){
        showError("โหลด QR Code library ไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ต");
        return;
    }

    hideError();
    qrContainer.innerHTML = "";

    var size = parseInt(
        document.getElementById("qrSize").value,
        10
    );

    try{

        new QRCode(qrContainer,{
            text:text,
            width:size,
            height:size,
            colorDark:"#000000",
            colorLight:"#ffffff",
            correctLevel:getLevel()
        });

        result.style.display = "block";

        setTimeout(function(){
            result.scrollIntoView({
                behavior:"smooth",
                block:"nearest"
            });
        },80);

    }catch(e){
        showError("สร้าง QR Code ไม่สำเร็จ ข้อมูลอาจยาวเกินไป");
    }
}

async function pasteFromClipboard(){

    hideError();

    try{

        var text = await navigator.clipboard.readText();

        if (!text){
            showError("Clipboard ไม่มีข้อความ");
            return;
        }

        input.value = text.slice(0,2000);
        charCount.textContent = input.value.length;
        input.focus();

    }catch(e){
        showError("Browser ไม่อนุญาตให้อ่าน Clipboard กรุณาใช้ Ctrl+V");
    }
}

function getQRDataUrl(){

    var canvas = qrContainer.querySelector("canvas");

    if (canvas){
        return canvas.toDataURL("image/png");
    }

    var img = qrContainer.querySelector("img");

    if (img && img.src){
        return img.src;
    }

    return null;
}

function downloadQR(){

    var src = getQRDataUrl();

    if (!src){
        showError("กรุณาสร้าง QR Code ก่อนดาวน์โหลด");
        return;
    }

    var a = document.createElement("a");

    a.href = src;
    a.download = "QRCode_" + getTimestamp() + ".png";

    document.body.appendChild(a);

    a.click();

    a.remove();
}

async function copyQR(){

    hideError();

    var canvas = qrContainer.querySelector("canvas");

    if (!canvas){
        showError("กรุณาสร้าง QR Code ก่อน");
        return;
    }

    if (!navigator.clipboard || typeof ClipboardItem === "undefined"){
        showError("Browser นี้ไม่รองรับการคัดลอกรูปภาพ กรุณาดาวน์โหลด PNG");
        return;
    }

    canvas.toBlob(async function(blob){

        try{

            await navigator.clipboard.write([
                new ClipboardItem({
                    "image/png":blob
                })
            ]);

            var btn = document.getElementById("copyBtn");
            var old = btn.textContent;

            btn.textContent = "คัดลอกแล้ว ✓";

            setTimeout(function(){
                btn.textContent = old;
            },1300);

        }catch(e){
            showError("ไม่สามารถคัดลอก QR Code ได้ กรุณาดาวน์โหลด PNG");
        }

    },"image/png");
}

function clearAll(){

    input.value = "";
    charCount.textContent = "0";

    qrContainer.innerHTML = "";

    result.style.display = "none";

    hideError();

    input.focus();
}

function getTimestamp(){

    var d = new Date();

    function p(n){
        return String(n).padStart(2,"0");
    }

    return d.getFullYear()
        + p(d.getMonth()+1)
        + p(d.getDate())
        + "_"
        + p(d.getHours())
        + p(d.getMinutes())
        + p(d.getSeconds());
}
</script>

</body>
</html>
